// Invert the same dependency-aware schedule used by the homepage.
function latestStart(plan,s,now=Date.now(),requiredOnly=false){
 const deadline=targetAt(plan.date,s.settings.target),copy=structuredClone(plan);
 for(const t of copy.tasks)if(t.id===s.active?.instanceId)t.minutes=remaining(t,s.active,now);
 const frozen={...s,active:null};let low=Math.ceil(new Date(`${plan.date}T04:00:00`).getTime()/60000),high=Math.floor(deadline/60000),best=null;
 while(low<=high){const mid=Math.floor((low+high)/2);if(schedule(copy,frozen,mid*60000,requiredOnly).end<=deadline){best=mid*60000;low=mid+1}else high=mid-1}

function taskAccuracy(s,id){

 const mean=a=>a.reduce((n,r)=>n+Math.abs(r.minutes-r.estimate),0)/a.length;
 const split=Math.floor(rs.length/2);
 return {n:rs.length,records:rs,error:rs.length?mean(rs):null,under:rs.filter(r=>r.minutes>r.estimate).length,over:rs.filter(r=>r.minutes<r.estimate).length,before:rs.length>=6?mean(rs.slice(0,split)):null,after:rs.length>=6?mean(rs.slice(split)):null,split};
}
function eveningSummary(s,plan){
 const rs=s.records.filter(r=>r.planId===plan.id);if(!rs.length)return null;
 const start=Math.min(...rs.map(r=>r.startAt)),end=Math.max(...rs.map(r=>r.endAt));
 const intervals=[];for(const r of rs){let cursor=r.startAt;for(const p of r.pauses){intervals.push([cursor,p.start]);cursor=p.end}intervals.push([cursor,r.endAt])}
 intervals.sort((a,b)=>a[0]-b[0]);let covered=0,last=start;for(const [a,b] of intervals){covered+=Math.max(0,b-Math.max(a,last));last=Math.max(last,b)}

}

const eveningCombos=[
 {id:'normal',name:'普通夜',hint:'喂猫 · 洗澡 · 咖啡 · 刷牙后准备明天衣服',hair:false,laundry:false},
 {id:'hair',name:'洗头夜',hint:'洗澡洗头吹发 · 刷牙后准备明天衣服',hair:true,laundry:false},
 {id:'laundry',name:'洗衣夜',hint:'普通夜 + 洗衣准备、晾衣 · 刷牙后准备明天衣服',hair:false,laundry:true},
 {id:'hair-laundry',name:'洗头＋洗衣',hint:'洗头整套 + 洗衣、晾衣 · 刷牙后准备明天衣服',hair:true,laundry:true}

function prepareCombo(s,plan,key){
 const combo=eveningCombos.find(c=>c.id===key);if(!combo)throw Error('未知的晚间组合');
 const next=structuredClone(plan),notices=[];
 const locked=t=>t.status==='done'||t.id===s.active?.instanceId||s.records.some(r=>r.instanceId===t.id);
 const laundryStarted=next.machineReady!=null||next.tasks.some(t=>t.templateId==='wash'&&locked(t));
 const opposite=combo.hair?'shower':'hair',preferred=combo.hair?'hair':'shower';
 const protectedBath=next.tasks.find(t=>(t.templateId===opposite||t.templateId==='shower-legacy')&&locked(t));
 const bath=protectedBath?protectedBath.templateId:preferred;
 if(protectedBath)notices.push('洗澡任务已完成或正在计时，保留原任务，不重复安排');
 const wanted=new Set(['cat',bath,'coffee','teeth','clothes',...(combo.laundry?['wash','hang']:[])]);
 next.tasks=next.tasks.filter(t=>{
  if(locked(t))return true;
  if(['wash','hang'].includes(t.templateId)&&laundryStarted)return true;
  if(t.templateId===opposite&&!protectedBath)return false;
  return !t.presetManaged||wanted.has(t.templateId);
 });
 if(!combo.laundry&&laundryStarted)notices.push('洗衣已启动，保留洗衣任务与晾衣等待');
 for(const id of wanted){
  if(next.tasks.some(t=>t.templateId===id))continue;
  const template=s.templates.find(t=>t.id===id);if(!template)throw Error('缺少组合所需的任务模板，请先恢复完整备份');
  next.tasks.push({...template,id:uid(),templateId:id,status:'pending',presetManaged:true,minutes:Math.max(1,Math.round(stats(s,id)?.median||template.minutes))});
 }

}

// Arrival support is operational state only; no waiting-time analytics are collected.
function arrivalTask(s,plan,now=Date.now()){

function migrateRoutine(s,now=Date.now()){

  const old=s.templates.find(t=>t.id==='shower');if(old){old.id='shower-legacy';old.enabled=false;old.archived=true}
  const bath=structuredClone(defaults.find(t=>t.id==='shower')),teeth=structuredClone(defaults.find(t=>t.id==='teeth'));
  if(!s.templates.some(t=>t.id==='shower'))s.templates.push(bath);
  if(!s.templates.some(t=>t.id==='teeth'))s.templates.push(teeth);
  for(const p of s.plans)for(const t of p.tasks)if(t.templateId==='shower'){
   if(p===current&&t.status==='pending'&&t.id!==s.active?.instanceId&&!s.records.some(r=>r.instanceId===t.id))Object.assign(t,{name:bath.name,step:bath.step,minutes:t.manualEstimate?t.minutes:bath.minutes});
   else t.templateId='shower-legacy';
  }
  for(const r of s.records)if(r.templateId==='shower')r.templateId='shower-legacy';
  if(current&&!current.tasks.some(t=>t.templateId==='teeth'))current.tasks.push({...teeth,id:uid(),templateId:'teeth',status:'pending'});
 }
 const clothes=structuredClone(defaults.find(t=>t.id==='clothes'));
 if(!s.templates.some(t=>t.id==='clothes'))s.templates.push(clothes);
 if(current&&!current.tasks.some(t=>t.templateId==='clothes'))current.tasks.push({...s.templates.find(t=>t.id==='clothes'),id:uid(),templateId:'clothes',status:'pending'});

function tailReady(tasks,t,activeId){if(t.id===activeId)return true;const other=tasks.filter(x=>x.id!==t.id&&x.status==='pending');return t.templateId==='teeth'?!other.some(x=>x.templateId!=='clothes'):t.templateId==='clothes'?other.length===0:true}

function taskCanStart(plan,t,now=Date.now()){return t?.status==='pending'&&(t.templateId!=='hang'||(plan.machineReady!=null&&plan.machineReady<=now))&&tailReady(plan.tasks,t)}

function finishMinutes(date,end){const d=new Date(end),[y,m,day]=date.split('-').map(Number);return (Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(y,m-1,day))/86400000*1440+d.getHours()*60+d.getMinutes()}

 }).sort((a,b)=>a.date.localeCompare(b.date))}
function checkArrival(s,p,at,now=Date.now()){
 if(at==null)return null;
 if(!Number.isFinite(at)||at<=0||at>now||eveningKey(at)!==p.date)throw Error('请选择这个晚间的到家时间，且不能晚于现在（晚间在凌晨04:00切换）');

function updateCard(){return `<section class="card"><h2>应用版本与更新</h2><p>当前版本 <strong>v${APP_VERSION}</strong></p><p id="pwa-status" role="status">${esc(updateStatus)}</p><div class="row"><button data-action="check-update">检查更新</button><button class="primary" data-action="apply-update" ${updateFound?'':'hidden'}>更新到新版</button></div><small>联网打开或回到应用时检查更新。发现新版只提示，确认后才刷新；请先保存正在填写的备注或设置。已保存的记录、计时和休息会保留，不会清理本机数据。主屏幕与其他浏览器的存储空间可能不同，不会自动合并。</small></section>`}
async function checkUpdates(manual=false){if(checkingUpdate)return;if(manual)dismissedUpdate=false;if(storageMode!=='persistent'||!/^https?:$/.test(location.protocol)){updateStatus='此预览不支持版本检查，请在已部署的网站中打开。';paintUpdate();return}if(!manual&&Date.now()-lastUpdateCheck<60000)return;lastUpdateCheck=Date.now();checkingUpdate=true;updateStatus='正在检查更新…';paintUpdate();try{if(swRegistration)await swRegistration.update();const response=await fetch(new URL('./version.json',location.href),{cache:'no-store'});if(!response.ok)throw Error();const info=await response.json();if(typeof info.version!=='string'||!/^\d+\.\d+\.\d+$/.test(info.version))throw Error();const newer=info.version.split('.').map(Number),current=APP_VERSION.split('.').map(Number);const differs=newer.some((n,i)=>n!==current[i]&&newer.slice(0,i).every((v,j)=>v===current[j])&&n>current[i]);if(differs){if(remoteVersion!==info.version)dismissedUpdate=false;remoteVersion=info.version;updateFound=true}if(swRegistration?.waiting)updateFound=true;updateStatus=updateFound?'有新版本可用，请先保存输入，再确认更新。':'当前已是最新版本。'}catch{updateStatus=updateFound?'新版已发现；网络暂不可用，已缓存的更新仍可尝试。':'暂时无法检查更新。可以继续使用当前版本，联网后再试。'}finally{checkingUpdate=false;paintUpdate()}}
function watchWorker(reg){if(reg.waiting){updateFound=true;updateStatus='有新版本等待更新。';paintUpdate()}reg.addEventListener('updatefound',()=>{const worker=reg.installing;worker?.addEventListener('statechange',()=>{if(worker.state==='installed'&&navigator.serviceWorker.controller){updateFound=true;updateStatus='有新版本等待更新。';paintUpdate()}})})}
async function activateUpdate(){try{if(swRegistration?.installing){await new Promise((resolve,reject)=>{const worker=swRegistration.installing,timer=setTimeout(()=>reject(Error('安装尚未完成，请稍后重试。')),15000);const done=()=>{if(['installed','activated'].includes(worker.state)){clearTimeout(timer);resolve()}else if(worker.state==='redundant'){clearTimeout(timer);reject(Error('更新安装失败，请联网后重试。'))}};worker.addEventListener('statechange',done);done()})}if(swRegistration?.waiting){reloadRequested=true;updateReloadTimer=setTimeout(()=>{reloadRequested=false;notify('更新尚未生效，请联网后再检查更新。',true)},15000);swRegistration.waiting.postMessage({type:'SKIP_WAITING'})}else location.reload()}catch(e){reloadRequested=false;notify(e.message||'更新失败，请稍后重试。',true)}}
function requestUpdate(){modal('<h2>更新应用？</h2><p>确认后刷新到新版。已保存的计时、休息、任务和记录会保留；尚未提交的输入不会自动保存，请先保存后再更新。</p><form><button class="primary">确认更新并刷新</button></form>',()=>{if(!save())return;dialog.close();void activateUpdate()})}
async function setupUpdates(){try{if(storageMode!=='persistent'||!/^https?:$/.test(location.protocol)||!('serviceWorker'in navigator)){updateStatus='此预览不支持离线缓存和版本更新检查。';paintUpdate();return}navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloadRequested){reloadRequested=false;clearTimeout(updateReloadTimer);location.reload()}});swRegistration=await navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'});watchWorker(swRegistration);void checkUpdates()}catch{updateStatus='离线缓存暂不可用，可继续使用在线功能。';paintUpdate()}}

 const available=state.templates.filter(t=>!t.archived&&!plan.tasks.some(x=>x.templateId===t.id)&&!(t.id==='shower'&&plan.tasks.some(x=>x.templateId==='hair')));

}
function machine(){modal('<h2>洗衣机等待</h2><form class="fields"><label>实际启动时间<input name="start" type="datetime-local" step="0.001" required value="'+dt(Date.now())+'"></label><label>机器运行分钟<input name="minutes" type="number" min="1" max="360" required value="'+(plan.machineMinutes||40)+'"></label><button class="primary">确认机器时间</button></form>',f=>{const start=new Date(f.get('start')).getTime();if(start>Date.now())throw Error('启动时间不能在未来');plan.machineMinutes=Number(f.get('minutes'));plan.machineReady=start+plan.machineMinutes*60000;dialog.close();refresh()})}
function recordForm(id){const r=state.records.find(r=>r.id===id);modal(`<h2>${r?'纠正记录':'补记一次'}</h2><form class="fields">${!r?`<label>任务<select name="template">${state.templates.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></label>`:''}<label>预估分钟<input type="number" min="1" max="1440" name="estimate" value="${r?.estimate||20}" required></label><label>开始时间<input type="datetime-local" step="0.001" name="start" value="${dt(r?.startAt||Date.now()-1200000)}" required></label><label>结束时间<input type="datetime-local" step="0.001" name="end" value="${dt(r?.endAt||Date.now())}" required></label>${reasonFields(r||{})}<label>备注<textarea name="note" rows="3" maxlength="500">${esc(r?.note||'')}</textarea></label><label><input type="checkbox" name="clear">清除原暂停时段（仅时间修正需要时）</label><p class="muted">补记会关联所选晚间的同类任务，不会重复生成完成记录。</p><button class="primary">保存记录</button></form>`,f=>{const t=r?null:state.templates.find(t=>t.id===f.get('template'));const start=new Date(f.get('start')).getTime(),end=new Date(f.get('end')).getTime();let p=r?state.plans.find(p=>p.id===r.planId):state.plans.find(p=>p.date===eveningKey(start));if(!p&&!r){p={id:uid(),date:eveningKey(start),tasks:[],machineReady:null}}let inst=r?null:p.tasks.find(x=>x.templateId===t.id);if(!r&&state.active?.instanceId===inst?.id)throw Error('该任务正在计时，请先结束计时');if(!r&&inst&&state.records.some(x=>x.instanceId===inst.id))throw Error('已有这项完成记录，请编辑原记录');if(!r&&!inst)inst={...t,id:uid(),templateId:t.id,status:'pending'};const result=validateRecord({...r,id:r?.id||uid(),instanceId:r?.instanceId||inst.id,templateId:r?.templateId||t.id,planId:p.id,name:r?.name||t.name,estimate:Number(f.get('estimate')),startAt:start,endAt:end,pauses:f.has('clear')?[]:r?.pauses||[],note:f.get('note'),reasonIds:f.getAll('reasons'),excluded:r?.excluded||false});if(r)Object.assign(r,result);else{if(!state.plans.includes(p))state.plans.push(p);if(!p.tasks.includes(inst))p.tasks.push(inst);inst.status='done';state.records.push(result)}dialog.close();refresh()})}
function download(data,name,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function importFile(e){try{const file=e.target.files[0];if(!file)return;if(file.size>10e6)throw Error('备份文件过大');const next=migrateRoutine(validateBackup(JSON.parse(await file.text())));modal('<h2>恢复这份备份？</h2><p>将替换本机全部记录、模板、计划和运行中计时。请先导出当前数据。</p><p>'+next.records.length+' 条记录，'+next.plans.length+' 个晚间计划。</p><form><button class="primary">确认完整恢复替换</button></form>',()=>{next.revision=Math.max(seenRevision,next.revision||0)+1;if(storageMode!=='temporary')localStorage.setItem(KEY,JSON.stringify(next));state=next;seenRevision=next.revision;storageFailed=false;plan=ensurePlan(state);dialog.close();render();notify('备份已恢复')})}catch(err){notify('恢复失败：'+err.message,true)}}
app.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const id=b.dataset.id,t=plan.tasks.find(t=>t.id===id);try{switch(b.dataset.action){case 'arrived':recordArrival();break;case 'edit-arrival':editArrival(id);break;case 'evening-activity':editEveningActivity(id);break;case 'check-update':void checkUpdates(true);break;case 'apply-update':requestUpdate();break;case 'copy-arrival':void copyArrival();break;case 'arrival-enter':arrivalChange({mode:'ready'});break;case 'arrival-ready':arrivalChange({mode:'ready'});break;case 'arrival-micro':arrivalChange({mode:'micro'});break;case 'arrival-rest-choice':arrivalChange({mode:'rest'});break;case 'arrival-rest':{if(!['5','10','none'].includes(id))throw Error('请选择休息时间');arrivalChange({mode:'rest',restUntil:id==='none'?null:Date.now()+Number(id)*60000});break}case 'arrival-plan':arrivalChange({mode:'plan'});break;case 'arrival-start':startSmall();break;case 'note':noteModal(id);break;case 'combo':chooseCombo(id);break;case 'summary':showSummary();break;case 'target':editTarget();break;case 'start':if(!state.active)estimateForm(t);break;case 'add':addTask();break;case 'editTask':editTask(t);break;case 'template':editTask(state.templates.find(t=>t.id===id),true);break;case 'up':{const i=plan.tasks.indexOf(t);[plan.tasks[i-1],plan.tasks[i]]=[plan.tasks[i],plan.tasks[i-1]];plan.manualOrder=true;refresh();break}case 'choose':document.querySelector('.section-head').scrollIntoView({behavior:'smooth'});break;case 'pause':{const a=state.active;if(a.pausedAt){a.pauses.push({start:a.pausedAt,end:Date.now()});a.pausedAt=null}else a.pausedAt=Date.now();refresh();break}case 'correctStart':{const a=state.active;modal(`<h2>纠正开始时间</h2><form><label>开始<input name="start" type="datetime-local" step="0.001" value="${dt(a.startAt)}" required></label><button class="primary">保存</button></form>`,f=>{const start=new Date(f.get('start')).getTime();if(start>Date.now()||start>(a.pauses[0]?.start||a.pausedAt||Date.now()))throw Error('开始时间不能晚于暂停或现在');a.startAt=start;dialog.close();refresh()});break}case 'finish':{const a=state.active;if(!a)break;const task=plan.tasks.find(x=>x.id===a.instanceId),end=Date.now();if(a.pausedAt)a.pauses.push({start:a.pausedAt,end});const r=validateRecord({id:uid(),instanceId:task.id,templateId:task.templateId,planId:plan.id,name:task.name,estimate:task.minutes,startAt:a.startAt,endAt:end,pauses:a.pauses,excluded:false,note:''});state.records.push(r);task.status='done';state.active=null;if(task.templateId==='wash')plan.machineReady=end+(plan.machineMinutes||40)*60000;if(save()){render();notify(`已记录：预估 ${task.minutes} 分钟，实际 ${mins(r.minutes)} 分钟。今晚又完成了一件。`);noteModal(r.id,()=>{if(task.templateId==='wash')machine();else if(plan.tasks.every(t=>t.status==='done')){document.querySelector('.evening-summary')?.scrollIntoView({block:'start'});notify('今晚的小事都完成了，结束小结已生成。')}})}break}case 'machine':machine();break;case 'ready':plan.machineReady=Date.now();refresh();break;case 'record':recordForm(id);break;case 'exclude':{const r=state.records.find(r=>r.id===id);r.excluded=!r.excluded;refresh();break}case 'deleteRecord':modal('<h2>删除这条记录？</h2><p>对应今晚任务会恢复为待做，洞察将重新计算。</p><form><button class="primary">确认删除</button></form>',()=>{const r=state.records.find(r=>r.id===id);state.records=state.records.filter(r=>r.id!==id);const task=state.plans.flatMap(p=>p.tasks).find(t=>t.id===r.instanceId);if(task)task.status='pending';dialog.close();refresh()});break;case 'export':state.settings.lastBackup=Date.now();save();download(JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2),'quiet-evening-backup.json','application/json');break;case 'csv':{const cell=x=>'"'+String(x).replaceAll('"','""')+'"';download('\ufeff任务,开始,结束,预估分钟,实际分钟,排除洞察,情境备注,其他备注\n'+state.records.map(r=>[r.name,new Date(r.startAt).toISOString(),new Date(r.endAt).toISOString(),r.estimate,r.minutes,r.excluded,reasonText(r),r.note||''].map(cell).join(',')).join('\n'),'quiet-evening-records.csv','text/csv');break}}}catch(err){notify(err.message,true)}});
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{state=migrateRoutine(validateBackup(JSON.parse(e.newValue)));seenRevision=state.revision;plan=ensurePlan(state);render();notify('已同步另一个标签页的更新')}catch{notify('另一个标签页的数据无效，未载入',true)}}});
window.addEventListener('hashchange',renderRoute);document.addEventListener('visibilitychange',()=>{if(!document.hidden){refresh();void checkUpdates()}});setInterval(()=>{const el=document.querySelector('#elapsed');if(el&&state.active)el.textContent=timerText();const countdown=document.querySelector('#rest-countdown');if(countdown&&!document.hidden){const seconds=Math.max(0,Math.ceil((Number(countdown.dataset.until)-Date.now())/1000));if(seconds===0&&!dialog.open)render();else countdown.textContent=restText(seconds)}},1000);setInterval(()=>{if(!dialog.open&&!sidebar.open&&view==='tonight')refresh()},30000);
if(!storageFailed)save();renderRoute();
// Some preview sandboxes throw even while reading navigator.serviceWorker.
void setupUpdates();
document.querySelector('#update-now').addEventListener('click',requestUpdate);
document.querySelector('#update-later').addEventListener('click',()=>{dismissedUpdate=true;document.querySelector('#update-banner').hidden=true});

app.addEventListener('keydown',e=>{if(e.target.matches('.finish-point')&&['Enter',' '].includes(e.key)){e.preventDefault();try{editEveningActivity(e.target.dataset.id)}catch(err){notify(err.message,true)}}});

</script></body></html>
