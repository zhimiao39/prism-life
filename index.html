 const mean=a=>a.reduce((n,r)=>n+Math.abs(r.minutes-r.estimate),0)/a.length;
 const split=Math.floor(rs.length/2);
 return {n:rs.length,records:rs,error:rs.length?mean(rs):null,under:rs.filter(r=>r.minutes>r.estimate).length,over:rs.filter(r=>r.minutes<r.estimate).length,before:rs.length>=6?mean(rs.slice(0,split)):null,after:rs.length>=6?mean(rs.slice(split)):null,split};
}
function eveningSummary(s,plan){

function prepareCombo(s,plan,key){

 const laundryStarted=next.machineReady!=null||next.tasks.some(t=>t.templateId==='wash'&&locked(t));
 const opposite=combo.hair?'shower':'hair',preferred=combo.hair?'hair':'shower';
 const protectedBath=next.tasks.find(t=>(t.templateId===opposite||t.templateId==='shower-legacy')&&locked(t));
 const bath=protectedBath?protectedBath.templateId:preferred;
 if(protectedBath)notices.push('洗澡任务已完成或正在计时，保留原任务，不重复安排');
 const wanted=new Set(['cat',bath,'coffee','teeth','clothes',...(combo.laundry?['wash','hang']:[])]);
 next.tasks=next.tasks.filter(t=>{
  if(locked(t))return true;
  if(['wash','hang'].includes(t.templateId)&&laundryStarted)return true;
  if(t.templateId===opposite&&!protectedBath)return false;
  return !t.presetManaged||wanted.has(t.templateId);
 });
 if(!combo.laundry&&laundryStarted)notices.push('洗衣已启动，保留洗衣任务与晾衣等待');
 for(const id of wanted){
  if(next.tasks.some(t=>t.templateId===id))continue;
  const template=s.templates.find(t=>t.id===id);if(!template)throw Error('缺少组合所需的任务模板，请先恢复完整备份');

}

function reasonCard(id){const reasons=reasonInsights(state,id);return `<div class="reason-insights"><h3>耗时差异的线索</h3>${reasons.length?reasons.map(reason=>`<p>${esc(reason.label)} · ${reason.n} 次${reason.n<3?'（样本较少）':''}<br><small>这些记录实际比预估${reason.delta>0?'多':reason.delta<0?'少':'相差'} ${Math.abs(reason.delta).toFixed(1)} 分钟（中位差）。</small></p>`).join(''):'<p class="muted">完成后记录当时的情况，再逐渐找线索。</p>'}<small>取同类任务最近10条有效记录，仅汇总你选择的情境；多选会重复计数，未备注不代表没有事件。记录关联不等于因果。</small></div>`}
function comboCard(){return `<section class="card combo-card"><h2>一键选择晚间组合</h2><div class="combo-options">${eveningCombos.map(c=>`<button data-action="combo" data-id="${c.id}" aria-pressed="${plan.comboKey===c.id}"><strong>${esc(c.name)}</strong><small>${esc(c.hint)}</small></button>`).join('')}</div><small>仅调整今晚：保留已完成、计时中和手动添加的额外任务；不会修改模板或历史。洗衣可以与其他家务并行。</small>${plan.comboNote?`<p class="combo-note" role="status">${esc(plan.comboNote)}</p>`:''}</section>`}
function chooseCombo(key){const previous=structuredClone(state),original=state;const next=prepareCombo(state,plan,key);state.plans[state.plans.findIndex(p=>p.id===plan.id)]=next;plan=next;if(save()){render();document.querySelector('.combo-card')?.scrollIntoView({block:'start'});notify(`已应用${eveningCombos.find(c=>c.id===key).name}${plan.comboNote?'，'+plan.comboNote:'，今晚任务与排程已更新'}`)}else if(state===original){state=previous;plan=ensurePlan(state);render()}}
function summaryCard(p=plan){const r=eveningSummary(state,p);if(!r)return '';const target=p.targetTime||state.settings.target,delta=Math.round((r.end-targetAt(p.date,target))/60000),rs=state.records.filter(record=>record.planId===p.id).sort((a,b)=>a.startAt-b.startAt);return `<section class="card evening-summary"><div class="eyebrow">${esc(p.date)} · ${r.complete?'今晚完成了':'截至最近一次完成'}</div><h2>${r.complete?'今晚结束小结':'今晚进度小结'}</h2><p>${r.complete?'事情做完了，接下来留给自己。':'已完成 '+r.count+' 件，剩下的慢慢来。'}</p>${r.complete?`<p class="summary-result">实际收工 <strong>${clock(r.end)}</strong> · 比 ${esc(target)} ${delta>0?'晚':delta<0?'早':'相差'} ${Math.abs(delta)} 分钟${p.targetTime?'':'（按当前目标参考）'}</p>`:''}<div class="margin-grid"><div>主动耗时（逐条合计）<strong>${mins(r.active)} 分钟</strong></div><div>第一件到最后一件跨度<strong>${mins(r.span)} 分钟</strong></div></div><p>预估合计 ${mins(r.estimate)} 分钟 · 实际主动 ${mins(r.active)} 分钟</p><p>开始 ${clock(r.start)} · ${r.complete?'实际收工':'最近完成'} ${clock(r.end)}</p><p>其余空档约 ${mins(r.gaps)} 分钟 <small>· 含暂停、机器等待或休息，未分别记录，不能区分。</small></p><details><summary>查看 ${r.count} 件已完成的事</summary>${rs.map(record=>`<p class="summary-task">✓ ${esc(record.name)}<br><small>预估 ${record.estimate} 分钟 · 实际 ${mins(record.minutes)} 分钟 · ${clock(record.startAt)}—${clock(record.endAt)}</small><br><small>${esc(reasonText(record))}${record.note?' · '+esc(record.note):''}</small></p>`).join('')}</details>${!r.complete?`<p class="muted">仍待完成：${esc(p.tasks.filter(t=>t.status==='pending').map(t=>t.name).join('、'))}</p>`:''}${r.excluded?`<small>小结保留全部真实记录（含 ${r.excluded} 条不纳入洞察的记录）。</small>`:''}<small>主动时间含准备和收尾；若手动记录重叠，合计可能大于跨度。不以更快作为评价。</small></section>`}

function arrivalCard(){const task=arrivalTask(state,plan),mode=arrivalMode(state,plan),rest=restState(plan);const start=task?`<button class="primary arrival-start" data-action="arrival-start">开始${esc(task.name)} · ${esc(task.step||'先把需要的东西拿出来')}</button><small>${task.manualEstimate?'本次手动预估':stats(state,task.templateId)?`历史参考${stats(state,task.templateId).n<3?'（样本较少）':''}`:'初始参考'} ${arrivalEstimate(state,task)} 分钟 · 从准备到收尾整套计时，可暂停；预估可在完整安排中调整。</small>`:'<p class="muted">当前没有可以开始的任务。已完成的不会重复加入；洗衣等待仍按实际机器时间处理。</p>';const restOptions=`<div class="rest-options"><button data-action="arrival-rest" data-id="5">休息5分钟</button><button data-action="arrival-rest" data-id="10">休息10分钟</button><button data-action="arrival-rest" data-id="none">暂时不定</button></div>`;return `<section class="arrival-card" aria-label="到家模式"><div class="eyebrow">到家了，先缓一缓</div>${mode==='micro'?`<h2>先不用做家务。</h2><p>按你舒服的方式，试试这几个小动作。</p><ol class="micro-steps"><li>坐直一点。</li><li>把双脚放到地上。</li><li>愿意的话，慢慢站起来。</li></ol><p class="muted">不用打勾，也不计时。站起来后仍想休息，也可以停下。</p>${start}<button class="text" data-action="arrival-rest" data-id="none">我想继续休息</button><button class="text" data-action="arrival-ready">回到上一步</button>`:mode==='rest'?`<h2>${rest?.due?'休息的时间到了。':'先安心休息一会儿。'}</h2>${rest?.seconds==null?'<p>这次先不定时间，愿意开始时再回来就好。</p>':rest.due?'<p>现在愿意先做一个小动作吗？</p>':`<p>这段休息是你给自己留的。</p><div id="rest-countdown" class="rest-countdown" data-until="${plan.arrival.restUntil}" aria-label="休息剩余时间">${restText(rest.seconds)}</div>`}${start}<p class="muted">想再休息一下，也可以重新选择。</p>${restOptions}<button class="text" data-action="arrival-micro">还是动不了，先再小一点</button>`:`<h2>今天辛苦了。</h2><p>今晚的安排可以稍后再看。<br>先做一个小动作，不用现在决定整晚怎么过。</p>${start}<button data-action="arrival-rest-choice" class="rest-choice">我想先休息一会儿</button><button class="text" data-action="arrival-micro">还是动不了，先再小一点</button>`}<button class="text view-plan" data-action="arrival-plan">直接看完整安排</button><small class="arrival-limit">休息到点只在页面内邀请一次；锁屏或后台不会保证提醒，回来后按时间戳恢复。${task&&task.templateId!==(state.settings.firstTaskId||'cat')?'优先任务已完成或今晚未安排，先从当前可做的一件开始。':''}</small></section>`}
function tonight(){const mode=arrivalMode(state,plan),focused=['ready','rest','micro'].includes(mode);return `<div class="intro"><div><div class="eyebrow">MAKE ROOM FOR YOUR EVENING</div><h1>今晚，慢慢来。</h1><p>一件一件就好 · ${esc(state.settings.phone)} 放下手机</p></div><button class="pill target-button" data-action="target" aria-label="修改收工上床时间，当前 ${esc(state.settings.target)}">☾ ${esc(state.settings.target)} 收工上床 <span aria-hidden="true">✎</span></button></div>

function fullTonight(){const now=Date.now(),all=schedule(plan,state,now),must=schedule(plan,state,now,true),pending=plan.tasks.filter(t=>t.status==='pending'),done=plan.tasks.length-pending.length;const next=all.rows.find(r=>r.start<=now)?.task;const active=state.active;const late=all.end>targetAt(plan.date,state.settings.target);const over=active&&elapsed(active)>plan.tasks.find(t=>t.id===active.instanceId)?.minutes;
return `<div class="overview"><div class="metric"><small>今晚的进度</small><strong>${done}<span> / ${plan.tasks.length} 件</span></strong><span>${pending.length?'还有 '+pending.length+' 件待完成':'今晚辛苦啦'}</span></div><div class="metric"><small>全部已选 · 预计收工</small><strong>${clock(all.end)}</strong><span>含 ${state.settings.buffer} 分钟缓冲</span></div><div class="metric"><small>全部必做 · 全局余量</small><strong>${Number.isFinite(must.end)?Math.abs(Math.ceil((targetAt(plan.date,state.settings.target)-must.end)/60000)):'—'}<span> 分钟</span></strong><span>${must.end>targetAt(plan.date,state.settings.target)?'预计晚于上床目标':'可自由安排'}</span></div></div>
${over?'<div class="warning">已超过原预估，余量待更新。下方收工时间是乐观下限，请调整预计时长。</div>':''}
${active?timerCard():next?`<section class="recommend"><div class="eyebrow">接下来，只做这一件</div><span class="cat" aria-hidden="true">♧</span><h2>${esc(next.name)}</h2><p class="reason">${next.templateId==='wash'?'先启动洗衣机，让等待与其他家务重叠。':plan.manualOrder?'按你调整的顺序，先完成这一件。':next.required?'这件是今晚必做，先完成较短的一件。':'必做事项已安排，可以处理这件小事。'}</p><p><strong>预计 ${next.minutes} 分钟</strong> <small>· ${stats(state,next.templateId)?'参考真实记录，可调整':'初始参考，可调整'}</small></p><p class="muted">现在开始，预计 ${clock(now+next.minutes*60000)} 完成这一件。</p><p class="step">第一步 · ${esc(next.step||'先把需要的东西拿出来')}</p><div class="margin-grid"><div>这一件完成后的单项余量<strong>${targetAt(plan.date,state.settings.target)<now+next.minutes*60000?'已晚于目标 ':''}${Math.abs(Math.floor((targetAt(plan.date,state.settings.target)-now-next.minutes*60000)/60000))} 分钟</strong></div><div>扣除其余必做与缓冲<strong>${timeLabel(must.end)}</strong></div></div><div class="actions"><button class="primary" data-action="start" data-id="${next.id}">开始这一件 →</button><button data-action="choose">换一件</button></div></section>`:pending.length?'<div class="card"><h2>洗衣机还在忙，你可以先休息。</h2><p class="muted">等待结束后再开始晾衣，机器时间不计入主动家务。</p></div>':'<div class="recommend"><h2>今晚的事情，都放下了。</h2><p>剩下的时间，留给自己。明天再慢慢来。</p></div>'}
${summaryCard()}${latestCard()}${comboCard()}
${plan.tasks.some(t=>t.templateId==='hang'&&t.status==='pending')||plan.machineReady?`<div class="card machine"><h3>≈ 洗衣机状态</h3><p>${plan.machineReady?plan.machineReady>Date.now()?`预计 ${clock(plan.machineReady)} 可晾衣 · 还需 ${Math.ceil((plan.machineReady-Date.now())/60000)} 分钟`:'衣服已洗好，可以晾衣':'尚未启动洗衣机'}</p><button data-action="machine">已启动 / 修改等待</button> <button data-action="ready">已经洗好</button><p class="muted">仅页面内提示，不提供锁屏闹钟。</p></div>`:''}
${late?`<section class="warning"><h3>给今晚的两个安排</h3><p><b>A · 尽量按时上床</b><br>${Number.isFinite(must.end)?`${must.end>targetAt(plan.date,state.settings.target)?`必做项也预计晚 ${Math.ceil((must.end-targetAt(plan.date,state.settings.target))/60000)} 分钟`:'保留全部必做，可以按时上床'}，约 ${clock(must.end)} 收工。`:'请先补充洗衣依赖。'}<br>建议推迟：${esc(pending.filter(t=>!t.required).map(t=>t.name).join('、')||'没有可推迟的额外事项')}。</p><p><b>B · 今晚全部完成</b><br>${all.rows.map(r=>esc(r.task.name)).join(' → ')}<br>约 ${clock(all.end)} 收工，${timeLabel(all.end)}。</p></section>`:''}
<div class="section-head"><h2>今晚的小事 <small>${done} / ${plan.tasks.length}</small></h2><div class="section-actions"><button class="text" data-action="summary">查看今晚小结</button><button class="text" data-action="add">＋ 添加任务</button></div></div>${plan.tasks.map((t,i)=>`<div id="task-${esc(t.id)}" class="task ${t.status==='done'?'done':''}"><div class="task-icon">${t.status==='done'?'✓':esc(t.icon||'◇')}</div><div class="task-content"><h3>${esc(t.name)}${t.required?'<span class="tag">必做</span>':''}</h3><small>${t.status==='done'?'已完成':`${t.minutes} 分钟 · ${t.templateId==='teeth'?'其他家务完成后再刷牙':t.templateId==='clothes'?'刷牙后准备明天的衣服':esc(t.step||'从一个小动作开始')}`}</small></div><div class="task-actions">${t.status!=='done'?`<button class="text" data-action="start" data-id="${t.id}" ${active||!taskCanStart(plan,t)?'disabled':''}>开始</button><button class="text" data-action="editTask" data-id="${t.id}">编辑</button><button class="text" aria-label="上移${esc(t.name)}" data-action="up" data-id="${t.id}" ${i===0?'disabled':''}>↑</button>`:`<button class="text" data-action="note" data-id="${state.records.find(r=>r.instanceId===t.id)?.id||''}">备注</button>`}</div></div>`).join('')}${state.records.length&&state.settings.backupReminder&&(!state.settings.lastBackup||Date.now()-state.settings.lastBackup>14*86400000)?'<p class="backup-due">◈ 记录只保存在本机。去设置导出一份备份吧。</p>':''}`}
function timerCard(){const a=state.active,t=plan.tasks.find(t=>t.id===a.instanceId);return `<section class="recommend timer"><div class="eyebrow">${a.pausedAt?'歇一会儿也可以':'正在做 · 专心这一件就好'}</div><h2>${esc(t.name)}</h2><div class="timer-number" id="elapsed">${timerText()}</div><p class="muted">原预估 ${t.minutes} 分钟 · 包含准备与收尾</p><p>${esc(t.step)}</p>${a.fromArrival?'<p class="muted">从第一个准备动作开始就算计时；需要歇一下可以暂停，完成整件事后再点完成。</p>':''}<button class="primary" data-action="finish">完成，收拾好了 ✓</button><button class="text" data-action="pause">${a.pausedAt?'继续计时':'暂停一下'}</button><button class="text" data-action="correctStart">纠正开始时间</button></section>`}

function insights(){const groups=state.templates.map(t=>({t,st:stats(state,t.id)})).filter(x=>x.st);const complete=state.plans.map(p=>{const rs=state.records.filter(r=>r.planId===p.id&&!r.excluded);const req=p.tasks.filter(t=>t.required);return req.length&&req.every(t=>rs.some(r=>r.instanceId===t.id))?{active:rs.filter(r=>req.some(t=>t.id===r.instanceId)).reduce((n,r)=>n+r.minutes,0),span:(Math.max(...rs.filter(r=>req.some(t=>t.id===r.instanceId)).map(r=>r.endAt))-Math.min(...rs.filter(r=>req.some(t=>t.id===r.instanceId)).map(r=>r.startAt)))/60000}:null}).filter(Boolean);const total=plan.tasks.filter(t=>t.required).reduce((n,t)=>n+t.minutes,0)+state.settings.buffer;const selected=state.records.filter(r=>!filter||r.templateId===filter).sort((a,b)=>b.endAt-a.endAt);return `<div class="intro"><div><div class="eyebrow">GET TO KNOW YOUR OWN RHYTHM</div><h1>了解自己的节奏</h1><p>不是为了更快，而是心里更有底。</p></div></div>${!groups.length?'<div class="card empty"><span>◌</span><h2>还在了解你的节奏</h2><p>完成第一次计时后，这里会告诉你：<br>原来这些事情，通常需要多久。</p><a href="#tonight"><button class="primary">开始第一次计时</button></a></div>':groups.map(({t,st})=>`<section class="card"><h2>${esc(t.name)}</h2><p>通常预估 ${mins(st.estimate)} 分钟，实际中位数 ${mins(st.median)} 分钟。</p><div class="legend">预估 ${mins(st.estimate)} 分钟</div><div class="bar"><i style="width:${Math.min(100,st.estimate/Math.max(st.estimate,st.high)*100)}%"></i></div><div class="legend">实际 ${mins(st.median)} 分钟</div><div class="bar"><i style="background:#577e6a;width:${st.median/Math.max(st.estimate,st.high)*100}%"></i></div><p class="muted">最近 ${st.n} 次 · ${st.n<3?'样本较少 · ':''}常见范围 ${mins(st.low)}—${mins(st.high)} 分钟<br>${new Date(st.records.at(-1).startAt).toLocaleDateString()} — ${new Date(st.records[0].endAt).toLocaleDateString()}</p><small>最近最多10次有效记录；范围为其中最短至最长。下次可先留 ${Math.ceil(st.median+2)} 分钟。</small>${st.n>=3?`<p class="muted">最近 ${st.n} 次中，有 ${st.records.filter(r=>r.minutes>r.estimate).length} 次实际超过预估。${st.records.filter(r=>r.minutes>r.estimate).length>st.n/2?'下次可以多留一点余地。':'逐渐了解需要的时间就好。'}</p>`:''}</section>`).join('')}
<section class="card"><h2>整套晚间事情</h2>${complete.length?`<p>完整必做组合 ${complete.length} 晚 · 主动耗时中位数 <b>${mins(median(complete.map(r=>r.active)))} 分钟</b></p><p>从第一件到最后一件的跨度中位数 ${mins(median(complete.map(r=>r.span)))} 分钟，含休息、等待与空档。</p>`:`<p>必做事项约 ${total} 分钟 <small>· 按各项估算，含缓冲</small></p><p class="muted">还没有完整组合历史，不作趋势判断。</p>`}</section>${latestCard()}${accuracyCard()}${summaryCard()}<div class="section-head"><h2>原始记录</h2><button class="text" data-action="record">＋ 补记</button></div><label>筛选任务<select id="record-filter"><option value="">全部任务</option>${state.templates.map(t=>`<option value="${t.id}" ${filter===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></label>${selected.length?selected.map(r=>`<div class="record"><div class="row"><h3>${esc(r.name)}</h3><span>${mins(r.minutes)} 分钟 ${r.excluded?'· 已排除':''}</span></div><small>${new Date(r.startAt).toLocaleDateString()} ${clock(r.startAt)}—${clock(r.endAt)} · 预估 ${r.estimate} 分钟</small><p class="record-reasons">${esc(reasonText(r))}</p><p>${esc(r.note||'')}</p><button class="text" data-action="record" data-id="${r.id}">编辑时间 / 备注</button><button class="text" data-action="exclude" data-id="${r.id}">${r.excluded?'重新纳入洞察':'不纳入洞察'}</button><button class="text danger" data-action="deleteRecord" data-id="${r.id}">删除</button></div>`).join(''):'<p class="muted">这里还没有记录。没有记录时，我们不会推测你的习惯。</p>'}`}
function accuracyCard(){const groups=state.templates.map(t=>({t,a:taskAccuracy(state,t.id)})).filter(x=>x.a.n);return `<section class="card task-accuracy"><h2>按任务看预估准确度</h2><p class="muted">每次误差 = |实际 − 本次预估|。同一任务按时间比较，不把喂猫和洗澡混在一起。</p>${groups.length?groups.map(({t,a})=>`<div class="accuracy-task"><h3>${esc(t.name)}</h3><p>最近 ${a.n} 次 · 平均绝对误差 ${a.error.toFixed(1)} 分钟</p><p class="muted">${new Date(a.records[0].startAt).toLocaleDateString()} — ${new Date(a.records.at(-1).startAt).toLocaleDateString()} · ${a.n<3?'样本较少 · ':''}低估 ${a.under} 次 / 高估 ${a.over} 次</p>${reasonCard(t.id)}${a.before===null?'<small>至少6条同类有效记录后，再比较前后两组。</small>':`<p>前 ${a.split} 次误差 ${a.before.toFixed(1)} 分钟 → 后 ${a.n-a.split} 次 ${a.after.toFixed(1)} 分钟。</p><small>${a.after<a.before?'近期这些记录的预估更贴近实际。':a.after>a.before?'近期这些记录的误差较大，下次可以参考常见耗时。':'两组平均误差相近。'}样本有限，任务内容变化也会影响结果。</small>`}</div>`).join(''):'<p class="muted">还在了解你的节奏。完成一次计时后，就能看到对应任务的误差。</p>'}<small>每类取最近最多10条未排除记录；编辑、删除或排除后重新计算。</small></section>`}
function settings(){return `<div class="intro"><div><div class="eyebrow">A SMALL SPACE OF YOUR OWN</div><h1>为自己留一点余地</h1><p>你的习惯，你来决定。</p></div></div><section class="card"><h2>晚间目标</h2><form id="settings-form" class="fields"><label>到家后的优先任务<select name="firstTaskId" aria-label="到家后的优先任务">${state.templates.filter(t=>!t.archived).map(t=>`<option value="${esc(t.id)}" ${(state.settings.firstTaskId||'cat')===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></label><small>默认先喂猫；优先任务若已完成、未安排或尚不能开始，会选择其他可开始的任务。</small><label><input name="arrivalEnabled" type="checkbox" ${state.settings.arrivalEnabled!==false?'checked':''}>新晚间优先显示到家模式</label><label>收工上床<input name="target" type="time" value="${state.settings.target}" required></label><label>放下手机<input name="phone" type="time" value="${state.settings.phone}" required></label><label>排程缓冲（分钟）<input name="buffer" type="number" min="0" max="120" value="${state.settings.buffer}" required></label><label><input name="reminder" type="checkbox" ${state.settings.backupReminder?'checked':''}>每14天温和提醒备份</label><button class="primary">保存设置</button></form><small>晚间归属以本地时间凌晨04:00切换；进行中的计时仍归原晚间。目标时间不会因跨零点自动跳到明晚。</small></section><section class="card"><h2>常用任务模板</h2><p class="muted">编辑模板只影响之后添加的任务，不改写历史。</p>${state.templates.filter(t=>!t.archived).map(t=>`<div class="task"><div class="task-content"><h3>${esc(t.name)}</h3><small>${t.minutes} 分钟 · ${t.enabled?'每日自动加入':'按需添加'} · ${t.required?'必做':'可延后'}</small></div><button class="text" data-action="template" data-id="${t.id}">编辑</button></div>`).join('')}</section><section class="card"><h2>留一份备份，更安心</h2><p class="muted">数据仅存于本机浏览器。清理站点数据、无痕浏览或换设备可能丢失记录。JSON 可完整恢复，CSV 用于查看。</p><div class="row"><button class="primary" data-action="export">导出完整备份</button><button data-action="csv">导出 CSV</button></div><label>从 JSON 恢复<input type="file" id="import" accept="application/json,.json"></label><small>恢复会替换全部当前数据，建议先导出；坏文件不会覆盖数据。</small></section><section class="card"><h2>把慢慢来放到主屏幕</h2><p>iPhone Safari → 分享 → 添加到主屏幕。</p><p class="muted">部署须使用 HTTPS。首次成功打开后缓存核心页面。计时按时间戳恢复，不依赖后台运行；不提供锁屏推送。</p><small>当前晚间 ${plan.date} · 放下手机目标 ${esc(state.settings.phone)}<br>本机时区：${esc(Intl.DateTimeFormat().resolvedOptions().timeZone)}</small></section>`}
function render(){storageStatus();view=location.hash.slice(1)||'tonight';document.querySelector('#date').textContent=new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'});app.innerHTML=view==='settings'?settings():view==='insights'?insights():tonight();document.querySelectorAll('nav a').forEach(a=>{const active=a.hash==='#'+view;a.classList.toggle('active',active);if(active)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});document.querySelector('.full-plan')?.addEventListener('toggle',e=>{fullPlanOpen=e.target.open});document.querySelector('#record-filter')?.addEventListener('change',e=>{filter=e.target.value;render()});const settingsForm=document.querySelector('#settings-form');if(settingsForm)wireForm(settingsForm,f=>{Object.assign(state.settings,{target:f.get('target'),phone:f.get('phone'),buffer:Number(f.get('buffer')),backupReminder:f.has('reminder'),arrivalEnabled:f.has('arrivalEnabled'),firstTaskId:f.get('firstTaskId')});plan.targetTime=state.settings.target;refresh();notify('设置已保存')});document.querySelector('#import')?.addEventListener('change',importFile);inviteRest()}
function editTarget(){modal(`<h2>修改收工上床时间</h2><form class="fields"><label>收工上床时间<input name="target" type="time" value="${esc(state.settings.target)}" required></label><p class="muted">保存为每日目标，今晚立即生效。凌晨00:00—03:59指这个晚间之后的次日凌晨；放下手机时间单独在设置中调整。</p><button class="primary">保存收工时间</button></form>`,f=>{const target=f.get('target');if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(target))throw Error('请选择有效时间');state.settings.target=target;plan.targetTime=target;if(save()){dialog.close();render();notify('收工时间已更新，今晚安排已重新计算')}})}
function estimateForm(t){const st=stats(state,t.templateId);modal(`<h2>开始 ${esc(t.name)}</h2><section class="history-reference"><h3>通常需要多久</h3>${st?`<p>实际中位数 <strong>${mins(st.median)} 分钟</strong> · 范围 ${mins(st.low)}—${mins(st.high)} 分钟</p><small>最近 ${st.n} 次有效记录${st.n<3?' · 样本较少':''}；范围为最短至最长，包含准备与收尾。</small>`:`<p>还没有有效历史记录</p><small>初始参考 ${state.templates.find(x=>x.id===t.templateId)?.minutes||t.minutes} 分钟，可自行调整。</small>`}</section><form><label>你这次预计多久（分钟）<input type="number" name="minutes" min="1" max="1440" value="${t.minutes}" required></label><p class="muted">今天的情况由你判断，包括准备、执行和收尾。</p><div class="row">${[10,20,30].map(n=>`<button type="button" data-min="${n}">${n} 分钟</button>`).join('')}</div><button class="primary">开始计时 →</button></form>`,f=>{if(state.active)throw Error('已有计时正在进行');if(!taskCanStart(plan,t))throw Error(t.templateId==='teeth'?'先完成其他家务，再开始刷牙':t.templateId==='clothes'?'先完成刷牙，再准备明天的衣服':'请先确认洗衣机已经洗好');t.minutes=Number(f.get('minutes'));state.active={instanceId:t.id,startAt:Date.now(),pauses:[],pausedAt:null};plan.arrival={mode:'done',restUntil:null};if(save()){dialog.close();render()}});body.querySelectorAll('[data-min]').forEach(b=>b.onclick=()=>body.querySelector('input').value=b.dataset.min)}
function editTask(t,template=false){modal(`<h2>${template?'编辑常用模板':'编辑今晚任务'}</h2><form class="fields"><label>名称<input name="name" value="${esc(t.name)}" maxlength="80" required></label><label>预计分钟<input name="minutes" type="number" min="1" max="1440" value="${t.minutes}" required></label><label>第一步提示<input name="step" value="${esc(t.step)}" maxlength="200"></label><label><input type="checkbox" name="required" ${t.required?'checked':''}>必做</label>${template?`<label><input type="checkbox" name="enabled" ${t.enabled?'checked':''}>每天自动带出</label>`:!t.required?`<button type="button" id="remove-task" class="danger">取消今晚这件事</button>`:''}<button class="primary">保存</button></form>`,f=>{Object.assign(t,{name:f.get('name').trim(),minutes:Number(f.get('minutes')),step:f.get('step'),required:f.has('required')});if(template)t.enabled=f.has('enabled');else t.manualEstimate=true;dialog.close();refresh()});body.querySelector('#remove-task')?.addEventListener('click',()=>{if(state.active?.instanceId===t.id)return notify('请先完成正在进行的计时',true);plan.tasks=plan.tasks.filter(x=>x!==t);dialog.close();refresh()})}
function addTask(){
 const available=state.templates.filter(t=>!t.archived&&!plan.tasks.some(x=>x.templateId===t.id)&&!(t.id==='shower'&&plan.tasks.some(x=>x.templateId==='hair')));
 modal(`<h2>为今晚加一件小事</h2><form class="fields"><label>选择任务<select name="template">${available.map(t=>`<option value="${esc(t.id)}">${esc(t.name)} · ${t.minutes} 分钟</option>`).join('')}<option value="custom">＋ 自定义任务</option></select></label><small>已加入今晚的任务不重复显示；可在任务列表中编辑。</small><div data-custom-fields><label>自定义名称<input name="name" maxlength="80" placeholder="例如：整理书桌"></label><label>自定义预计分钟<input name="minutes" type="number" min="1" max="1440" value="10"></label></div><button class="primary">加入今晚</button></form>`,f=>{
  const custom=f.get('template')==='custom';
  let template=state.templates.find(t=>t.id===f.get('template'));
  if(custom){const name=String(f.get('name')||'').trim(),minutes=Number(f.get('minutes'));if(!name)throw Error('请填写自定义任务名称');if(!Number.isFinite(minutes)||minutes<1||minutes>1440)throw Error('预计时长需在1—1440分钟之间');template={id:uid(),name,minutes,step:'从一个小动作开始',required:false}}
  if(!template)throw Error('这项任务已不可用，请重新选择');
  if(plan.tasks.some(x=>x.templateId===template.id))throw Error('今晚已经有这项任务，请在任务列表中编辑');
  if(template.id==='hair'){const shower=plan.tasks.find(x=>x.templateId==='shower');if(shower&&(shower.status==='done'||state.active?.instanceId===shower.id))throw Error('普通洗澡已完成或正在计时，请先处理当前记录')}
  const previous=structuredClone(state),original=state;
  if(custom)state.templates.push(template);
  if(template.id==='hair')plan.tasks=plan.tasks.filter(x=>x.templateId!=='shower');
  const instance={...template,id:uid(),templateId:template.id,status:'pending',minutes:Math.max(1,Math.round(stats(state,template.id)?.median||template.minutes))};
  plan.tasks.push(instance);
  if(save()){dialog.close();render();const row=document.getElementById('task-'+instance.id);row?.classList.add('just-added');row?.scrollIntoView({block:'center'});notify(`已添加「${template.name}」，今晚安排已更新`)}
  else if(state===original){state=previous;plan=ensurePlan(state);render()}
 });
 const select=body.querySelector('[name=template]'),fields=body.querySelector('[data-custom-fields]');
 const update=()=>{const custom=select.value==='custom';fields.hidden=!custom;fields.querySelectorAll('input').forEach(input=>{input.disabled=!custom;input.required=custom})};select.addEventListener('change',update);update();
}
function machine(){modal('<h2>洗衣机等待</h2><form class="fields"><label>实际启动时间<input name="start" type="datetime-local" step="0.001" required value="'+dt(Date.now())+'"></label><label>机器运行分钟<input name="minutes" type="number" min="1" max="360" required value="'+(plan.machineMinutes||40)+'"></label><button class="primary">确认机器时间</button></form>',f=>{const start=new Date(f.get('start')).getTime();if(start>Date.now())throw Error('启动时间不能在未来');plan.machineMinutes=Number(f.get('minutes'));plan.machineReady=start+plan.machineMinutes*60000;dialog.close();refresh()})}
function recordForm(id){const r=state.records.find(r=>r.id===id);modal(`<h2>${r?'纠正记录':'补记一次'}</h2><form class="fields">${!r?`<label>任务<select name="template">${state.templates.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></label>`:''}<label>预估分钟<input type="number" min="1" max="1440" name="estimate" value="${r?.estimate||20}" required></label><label>开始时间<input type="datetime-local" step="0.001" name="start" value="${dt(r?.startAt||Date.now()-1200000)}" required></label><label>结束时间<input type="datetime-local" step="0.001" name="end" value="${dt(r?.endAt||Date.now())}" required></label>${reasonFields(r||{})}<label>备注<textarea name="note" rows="3" maxlength="500">${esc(r?.note||'')}</textarea></label><label><input type="checkbox" name="clear">清除原暂停时段（仅时间修正需要时）</label><p class="muted">补记会关联所选晚间的同类任务，不会重复生成完成记录。</p><button class="primary">保存记录</button></form>`,f=>{const t=r?null:state.templates.find(t=>t.id===f.get('template'));const start=new Date(f.get('start')).getTime(),end=new Date(f.get('end')).getTime();let p=r?state.plans.find(p=>p.id===r.planId):state.plans.find(p=>p.date===eveningKey(start));if(!p&&!r){p={id:uid(),date:eveningKey(start),tasks:[],machineReady:null}}let inst=r?null:p.tasks.find(x=>x.templateId===t.id);if(!r&&state.active?.instanceId===inst?.id)throw Error('该任务正在计时，请先结束计时');if(!r&&inst&&state.records.some(x=>x.instanceId===inst.id))throw Error('已有这项完成记录，请编辑原记录');if(!r&&!inst)inst={...t,id:uid(),templateId:t.id,status:'pending'};const result=validateRecord({...r,id:r?.id||uid(),instanceId:r?.instanceId||inst.id,templateId:r?.templateId||t.id,planId:p.id,name:r?.name||t.name,estimate:Number(f.get('estimate')),startAt:start,endAt:end,pauses:f.has('clear')?[]:r?.pauses||[],note:f.get('note'),reasonIds:f.getAll('reasons'),excluded:r?.excluded||false});if(r)Object.assign(r,result);else{if(!state.plans.includes(p))state.plans.push(p);if(!p.tasks.includes(inst))p.tasks.push(inst);inst.status='done';state.records.push(result)}dialog.close();refresh()})}
function download(data,name,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function importFile(e){try{const file=e.target.files[0];if(!file)return;if(file.size>10e6)throw Error('备份文件过大');const next=migrateRoutine(validateBackup(JSON.parse(await file.text())));modal('<h2>恢复这份备份？</h2><p>将替换本机全部记录、模板、计划和运行中计时。请先导出当前数据。</p><p>'+next.records.length+' 条记录，'+next.plans.length+' 个晚间计划。</p><form><button class="primary">确认完整恢复替换</button></form>',()=>{next.revision=Math.max(seenRevision,next.revision||0)+1;if(storageMode!=='temporary')localStorage.setItem(KEY,JSON.stringify(next));state=next;seenRevision=next.revision;storageFailed=false;plan=ensurePlan(state);dialog.close();render();notify('备份已恢复')})}catch(err){notify('恢复失败：'+err.message,true)}}
app.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const id=b.dataset.id,t=plan.tasks.find(t=>t.id===id);try{switch(b.dataset.action){case 'arrival-enter':arrivalChange({mode:'ready'});break;case 'arrival-ready':arrivalChange({mode:'ready'});break;case 'arrival-micro':arrivalChange({mode:'micro'});break;case 'arrival-rest-choice':arrivalChange({mode:'rest'});break;case 'arrival-rest':{if(!['5','10','none'].includes(id))throw Error('请选择休息时间');arrivalChange({mode:'rest',restUntil:id==='none'?null:Date.now()+Number(id)*60000});break}case 'arrival-plan':arrivalChange({mode:'plan'});break;case 'arrival-start':startSmall();break;case 'note':noteModal(id);break;case 'combo':chooseCombo(id);break;case 'summary':showSummary();break;case 'target':editTarget();break;case 'start':if(!state.active)estimateForm(t);break;case 'add':addTask();break;case 'editTask':editTask(t);break;case 'template':editTask(state.templates.find(t=>t.id===id),true);break;case 'up':{const i=plan.tasks.indexOf(t);[plan.tasks[i-1],plan.tasks[i]]=[plan.tasks[i],plan.tasks[i-1]];plan.manualOrder=true;refresh();break}case 'choose':document.querySelector('.section-head').scrollIntoView({behavior:'smooth'});break;case 'pause':{const a=state.active;if(a.pausedAt){a.pauses.push({start:a.pausedAt,end:Date.now()});a.pausedAt=null}else a.pausedAt=Date.now();refresh();break}case 'correctStart':{const a=state.active;modal(`<h2>纠正开始时间</h2><form><label>开始<input name="start" type="datetime-local" step="0.001" value="${dt(a.startAt)}" required></label><button class="primary">保存</button></form>`,f=>{const start=new Date(f.get('start')).getTime();if(start>Date.now()||start>(a.pauses[0]?.start||a.pausedAt||Date.now()))throw Error('开始时间不能晚于暂停或现在');a.startAt=start;dialog.close();refresh()});break}case 'finish':{const a=state.active;if(!a)break;const task=plan.tasks.find(x=>x.id===a.instanceId),end=Date.now();if(a.pausedAt)a.pauses.push({start:a.pausedAt,end});const r=validateRecord({id:uid(),instanceId:task.id,templateId:task.templateId,planId:plan.id,name:task.name,estimate:task.minutes,startAt:a.startAt,endAt:end,pauses:a.pauses,excluded:false,note:''});state.records.push(r);task.status='done';state.active=null;if(task.templateId==='wash')plan.machineReady=end+(plan.machineMinutes||40)*60000;if(save()){render();notify(`已记录：预估 ${task.minutes} 分钟，实际 ${mins(r.minutes)} 分钟。今晚又完成了一件。`);noteModal(r.id,()=>{if(task.templateId==='wash')machine();else if(plan.tasks.every(t=>t.status==='done')){document.querySelector('.evening-summary')?.scrollIntoView({block:'start'});notify('今晚的小事都完成了，结束小结已生成。')}})}break}case 'machine':machine();break;case 'ready':plan.machineReady=Date.now();refresh();break;case 'record':recordForm(id);break;case 'exclude':{const r=state.records.find(r=>r.id===id);r.excluded=!r.excluded;refresh();break}case 'deleteRecord':modal('<h2>删除这条记录？</h2><p>对应今晚任务会恢复为待做，洞察将重新计算。</p><form><button class="primary">确认删除</button></form>',()=>{const r=state.records.find(r=>r.id===id);state.records=state.records.filter(r=>r.id!==id);const task=state.plans.flatMap(p=>p.tasks).find(t=>t.id===r.instanceId);if(task)task.status='pending';dialog.close();refresh()});break;case 'export':state.settings.lastBackup=Date.now();save();download(JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2),'quiet-evening-backup.json','application/json');break;case 'csv':{const cell=x=>'"'+String(x).replaceAll('"','""')+'"';download('\ufeff任务,开始,结束,预估分钟,实际分钟,排除洞察,情境备注,其他备注\n'+state.records.map(r=>[r.name,new Date(r.startAt).toISOString(),new Date(r.endAt).toISOString(),r.estimate,r.minutes,r.excluded,reasonText(r),r.note||''].map(cell).join(',')).join('\n'),'quiet-evening-records.csv','text/csv');break}}}catch(err){notify(err.message,true)}});
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{state=migrateRoutine(validateBackup(JSON.parse(e.newValue)));seenRevision=state.revision;plan=ensurePlan(state);render();notify('已同步另一个标签页的更新')}catch{notify('另一个标签页的数据无效，未载入',true)}}});
window.addEventListener('hashchange',render);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});setInterval(()=>{const el=document.querySelector('#elapsed');if(el&&state.active)el.textContent=timerText();const countdown=document.querySelector('#rest-countdown');if(countdown&&!document.hidden){const seconds=Math.max(0,Math.ceil((Number(countdown.dataset.until)-Date.now())/1000));if(seconds===0&&!dialog.open)render();else countdown.textContent=restText(seconds)}},1000);setInterval(()=>{if(!dialog.open&&!sidebar.open&&view==='tonight')refresh()},30000);
if(!storageFailed)save();render();
// Accessing navigator.serviceWorker itself can throw in a sandboxed preview.
try{if(storageMode==='persistent'&&/^https?:$/.test(location.protocol)&&'serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>notify('离线缓存暂不可用，在线功能仍可使用。'))}catch{notify('当前预览不支持离线缓存，页面交互仍可使用。')}

</script></body></html>
